name: CI

on:
  push:
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Host qualification
        run: make clean qualify-m2-host

  amiga-cross-build:
    runs-on: ubuntu-latest
    container:
      image: sebastianbergmann/amiga-gcc:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Show compiler
        run: m68k-amigaos-gcc --version
      - name: Build 68000 Amiga binary
        run: make clean amiga AMIGA_CC=m68k-amigaos-gcc
